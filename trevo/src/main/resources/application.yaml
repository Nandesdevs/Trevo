spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

app:
  trevo:
    uploads:
      dir: ${UPLOAD_DIR:/tmp/uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000