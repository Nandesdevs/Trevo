spring:
  application:
    name: trevo
  datasource:
    url: jdbc:mysql://localhost:3306/trevo?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  servlet:
    context-path: /api/v1

app:
  trevo:
    uploads:
      dir: uploads
  jwt:
    secret: "minha-chave-super-secreta-com-pelo-menos-32-caracteres-trevo"
    expiration-ms: 86400000